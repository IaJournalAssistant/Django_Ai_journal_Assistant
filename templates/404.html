{% extends 'layouts/blank.html' %}

{% block content %}

<div class="max-w-4xl mx-auto px-8 py-24 text-center min-h-screen flex flex-col items-center justify-center">
    <div class="mb-8">
        <div class="inline-block bg-gradient-to-br from-indigo-600 to-purple-600 w-32 h-32 rounded-full flex items-center justify-center mb-6 mx-auto shadow-2xl">
            <svg class="w-16 h-16 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
        </div>
    </div>
    <h1 class="text-7xl font-bold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent mb-6">404</h1>
    <h2 class="text-3xl font-bold text-gray-800 mb-4">Page Not Found</h2>
    <p class="text-xl text-gray-600 mb-10 max-w-2xl">
        Oops! The page you're looking for seems to have wandered off. Let's get you back on track.
    </p>
    <div class="flex gap-4 flex-col sm:flex-row">
        <a href="/" class="button bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 px-8 py-4 text-lg font-bold rounded-full shadow-xl transform hover:scale-105 transition-all">
            Go Home
        </a>
        {% if request.user.is_authenticated %}
        <a href="{% url 'journal-list' %}" class="button !bg-gray-600 hover:!bg-gray-700 px-8 py-4 text-lg font-bold rounded-full shadow-xl">
            My Journals
        </a>
        {% endif %}
    </div>
</div>

{% endblock %}
