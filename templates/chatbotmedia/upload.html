{% extends 'layouts/blank.html' %}
{% load static %}

{% block content %}
<div class="min-h-screen bg-gray-50 py-12">
  <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-md p-8 border border-gray-200">
    <!-- Header -->
    <div class="text-center mb-8">
      <h1 class="text-4xl font-bold text-gray-900 mb-2">Analyse d’image avec l’IA</h1>
      <p class="text-gray-600 text-lg">
        Téléversez une image pour extraire le texte, analyser le sentiment et détecter l’émotion.
      </p>
    </div>

    <!-- Upload Box -->
    <div class="upload-box flex flex-col items-center space-y-6">
      <label class="block">
        <span class="sr-only">Choisir une image</span>
        <input type="file" id="image-input" accept="image/*"
          class="block w-full text-sm text-gray-500
                 file:mr-4 file:py-2 file:px-4
                 file:rounded-lg file:border-0
                 file:text-sm file:font-semibold
                 file:bg-indigo-50 file:text-indigo-700
                 hover:file:bg-indigo-100 cursor-pointer" />
      </label>

      <button onclick="uploadFile()"
        class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-lg text-lg font-medium transition-all duration-200 shadow">
        📤 Analyser l’image
      </button>
    </div>

    <!-- Loading -->
    <div id="loading" class="hidden mt-8 text-center">
      <div class="flex justify-center items-center space-x-3">
        <div class="w-6 h-6 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
        <p class="text-gray-600">Analyse en cours...</p>
      </div>
    </div>

    <!-- Result Box -->
    <div id="result" class="result-box mt-10 hidden bg-gray-50 border border-gray-200 rounded-xl p-6 shadow-inner">
      <h2 class="text-2xl font-semibold text-gray-800 mb-4">Résultat de l’analyse</h2>
      <div class="space-y-3 text-gray-700">
        <p><strong>📝 Texte extrait :</strong> <span id="text-result"></span></p>
        <p><strong>😊 Sentiment :</strong> <span id="sentiment-result"></span></p>
        <p><strong>🎭 Émotion :</strong> <span id="emotion-result"></span></p>
      </div>
      <div id="image-preview" class="mt-6 text-center"></div>
    </div>
  </div>
</div>

<script>
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

async function uploadFile() {
  const input = document.getElementById('image-input');
  const file = input.files[0];
  if (!file) {
    alert('Veuillez sélectionner une image.');
    return;
  }

  const formData = new FormData();
  formData.append('image', file);

  document.getElementById('loading').classList.remove('hidden');
  document.getElementById('result').classList.add('hidden');

  try {
    const response = await fetch(`/chatbotmedia/images/`, {
      method: 'POST',
      headers: { 'X-CSRFToken': getCookie('csrftoken') },
      body: formData
    });

    const data = await response.json();
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('result').classList.remove('hidden');

    document.getElementById('text-result').innerText = data.extracted_text || 'Aucun texte détecté';
    document.getElementById('sentiment-result').innerText = data.sentiment || 'Inconnu';
    document.getElementById('emotion-result').innerText = data.emotion || 'Inconnue';
    document.getElementById('image-preview').innerHTML = `<img src="${data.image_url}" class="rounded-lg shadow-md max-h-80 mx-auto mt-4">`;

  } catch (error) {
    console.error(error);
    document.getElementById('loading').classList.add('hidden');
    alert("Une erreur est survenue pendant l’analyse de l’image.");
  }
}
</script>
{% endblock %}
