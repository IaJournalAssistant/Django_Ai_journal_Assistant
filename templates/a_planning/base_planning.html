{% extends 'base.html' %}
{% load static %}

{% block layout %}
<div class="min-h-screen bg-gradient-to-br from-gray-50 via-white to-indigo-50">
    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block planning_content %}
        {% endblock %}
    </main>
</div>
{% endblock %}

{% block javascript %}
<script>
    // Planning module specific JavaScript
    document.addEventListener('DOMContentLoaded', function() {
        // Auto-refresh functionality for dynamic content
        if (typeof htmx !== 'undefined') {
            // Configure HTMX for planning module
            htmx.config.defaultSwapStyle = 'outerHTML';
            htmx.config.defaultSwapDelay = 100;
        }
    });
</script>
{% endblock %}
