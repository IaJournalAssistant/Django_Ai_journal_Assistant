{% load static %}
{% load django_htmx %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Django Template">
    <title>Project Title</title>
    <link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}">
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://unpkg.com/htmx.org@2.0.2"></script>
    {% django_htmx_script %}
    <script src="https://unpkg.com/hyperscript.org@0.9.12"></script>
    <script src="https://cdn.tailwindcss.com"></script>
        <style type="text/tailwindcss">
            [x-cloak] { 
                display: none !important; 
            }
            h1 { @apply text-4xl font-bold mb-4; }
            h2 { @apply text-xl font-bold mb-2; }
            h3 { @apply text-lg font-bold; }
            p { @apply mb-4; }

            .button, button, [type='submit'], [type='button'] {
                @apply bg-indigo-600 text-white font-semibold rounded-lg shadow-md transition transform hover:-translate-y-0.5 cursor-pointer;
            }
        
            .button, button a, [type='submit'], [type='button'] {
                @apply px-6 py-4 inline-block;
            }
        
            .button:hover, button:hover, [type='submit']:hover, [type='button']:hover {
                @apply bg-indigo-700 shadow-lg;
            }
        
            .button:active, button:active, [type='submit']:active, [type='button']:active {
                @apply scale-95;
            }
        
            .button.alert, button.alert { @apply bg-red-700; }
            .button.alert:hover, button.alert:hover { @apply bg-red-600; }
            .button-red { @apply !bg-red-500 hover:!bg-red-600; }
            .button-gray { @apply !bg-gray-300 hover:!bg-[#c3c9d0]; }
        
            .navitems>li>a {
                @apply flex items-center gap-2 h-12 px-4 hover:bg-[rgba(31,41,55,0.18)] rounded-lg;
            }

            /* card styles */
            .card { @apply bg-white rounded-lg shadow-sm p-4 transition hover:shadow-lg hover:scale-[1.01]; }

            /* tag badge variants */
            .tag-pill { @apply inline-block mr-2 mb-2 px-3 py-1 rounded-full text-sm bg-indigo-50 text-indigo-700; }
        
            .hoverlist>* { @apply hover:bg-gray-100 rounded-md transition duration-150; }
            .hoverlist>*>a { @apply flex items-center p-2; }
            .highlight { @apply !bg-indigo-100; }
        
            .allauth content a { @apply underline underline-offset-2; }
            .allauth content a:hover { @apply text-indigo-500; }
        
            .allauth form[action="/accounts/signup/"] ul { @apply hidden; }
            .allauth form[action="/accounts/signup/"] ul.errorlist { @apply block; }
            .allauth .helptext { @apply block mt-4; }
        
            label { @apply hidden; }
            label[for="id_remember"] { @apply inline-block w-auto mr-2; }
        
            input[type=file] { @apply bg-white pl-0; }
            input[name="remember"] { @apply w-auto; }
        
            .textarea, textarea, input { @apply w-full rounded-lg py-4 px-5 bg-gray-100; }
        
            .errorlist li { @apply p-1 pl-4 border-l-red-500 border-l-4 border-solid mb-2 text-red-500; }
        
            .alert-info { @apply bg-sky-500; }
            .alert-success { @apply bg-green-500; }
            .alert-warning { @apply bg-red-500; }
            .alert-danger { @apply bg-red-500; }
        </style>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}' class="{% block class %}{% endblock %}">
	
    {% include 'includes/messages.html' %}

    {% include 'includes/header.html' %}

    {% block layout %}
    {% endblock %}

    {% block javascript %}{% endblock %}

</body>
</html>
