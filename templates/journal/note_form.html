{% extends 'layouts/blank.html' %}
{% block content %}
<div class="max-w-2xl mx-auto px-6 py-8">
  <div class="bg-white rounded-lg shadow p-6">
    <h1 class="text-2xl font-bold mb-4">Create / Edit Note</h1>
    <form method="post" class="space-y-4">{% csrf_token %}
      <div>
        <label class="block text-sm font-medium text-gray-700">Title</label>
        {{ form.title }}
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Content</label>
        {{ form.content }}
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Tags</label>
        {{ form.tags }}
        <p class="text-sm text-gray-500 mt-1">Select one or more existing tags for this note. <a class="text-indigo-600 hover:underline" href="{% url 'tag-create' %}">Create tag</a></p>
      </div>
      <div class="flex gap-2">
        <button type="submit" class="button">Save</button>
        <a href="{% url 'note-list' %}" class="button button-gray">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
