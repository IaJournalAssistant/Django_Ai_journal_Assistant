<!DOCTYPE html>
<html>
<head>
    <title>Test AI Response Formatting</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-8 bg-gray-100">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-2xl font-bold mb-4">AI Response Formatting Test</h1>
        
        <!-- AI Results Display -->
        <div id="ai-results" class="mt-4">
            <div class="bg-white bg-opacity-20 rounded-lg p-4">
                <div class="flex items-center justify-between mb-3">
                    <h3 class="text-white font-semibold">AI Response</h3>
                    <button onclick="copyAIResponse()" 
                            class="bg-white bg-opacity-20 hover:bg-opacity-30 text-white px-3 py-1 rounded text-sm transition-all flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                        </svg>
                        Copy
                    </button>
                </div>
                <div id="ai-content" class="text-white"></div>
            </div>
        </div>
        
        <button onclick="testAIResponse()" class="mt-4 bg-blue-500 text-white px-4 py-2 rounded">
            Test AI Response Formatting
        </button>
    </div>

    <script>
        function testAIResponse() {
            const testContent = `[{'output': ' Current Status Assessment:- Overall Workload: Moderate, with 2 tasks in progress, 3 pending, and 1 completed. Two high-priority tasks are nearing deadlines.- Immediate Attention: "Develop homepage" (due in 5 days) and "App UI mockups" (due in 10 days) require focused effort to meet deadlines. Key Insights:- Critical Tasks: "Develop homepage" is critical for the website redesign and nearing its deadline. "App UI mockups" is another high-priority task that needs attention soon.- Potential Bottlenecks: Balancing the high-priority tasks across projects could strain resources. Ensure enough time is allocated to each.- Workload Balance: The user is managing tasks across multiple projects effectively, but the concentration of high-priority tasks in the next two weeks could be challenging. Actionable Recommendations:1. Priority Adjustments: Focus on completing "Develop homepage" first, then transition to "App UI mockups."2. Time Management: Block dedicated time for these tasks to avoid overcommitment. Consider delegating "Market research analysis" if possible.3. Next Steps: Use a structured schedule to allocate specific hours to each task daily, ensuring deadlines are met without burnout. Urgent Items:- Approaching Deadlines: "Develop homepage" (5 days) and "App UI mockups" (10 days).- At Risk: Missing the deadline for "Develop homepage" could delay the website redesign project.- Dependencies: Ensure "Design wireframes" completion supports the seamless start of "App UI mockups."This structured approach will help manage the workload effectively and meet critical deadlines.'}]`;
            
            showAIResults(testContent);
        }

        function showAIResults(content) {
            // Extract message content from JSON - handle both old and new formats
            let messageContent = content;
            try {
                const parsed = JSON.parse(content);

                // New format: array with output field
                if (Array.isArray(parsed) && parsed.length > 0 && parsed[0].output) {
                    messageContent = parsed[0].output;
                }
                // Old format: direct message field
                else if (parsed.message) {
                    messageContent = parsed.message;
                }
                // Direct object with output field
                else if (parsed.output) {
                    messageContent = parsed.output;
                }
            } catch (e) {
                // If JSON parsing fails, use content as-is
                console.log('JSON parsing failed, using content as-is');
            }

            // Display clean formatted text
            const aiContentDiv = document.getElementById('ai-content');
            
            // Format the content with basic markdown-like styling
            let formattedContent = messageContent
                // Format headers
                .replace(/^([A-Z][^:]+):$/gm, '<h4 class="font-semibold text-gray-800 mt-4 mb-2 border-b border-gray-200 pb-1">$1</h4>')
                
                // Format bullet points
                .replace(/^- (.+)$/gm, '<div class="mb-1 flex items-start gap-2"><span class="text-gray-500 mt-1">•</span><span class="text-gray-700">$1</span></div>')
                
                // Format numbered lists
                .replace(/^(\d+)\. (.+)$/gm, '<div class="mb-1 flex items-start gap-2"><span class="font-semibold text-gray-800 min-w-[20px]">$1.</span><span class="text-gray-700">$2</span></div>')
                
                // Highlight quoted items
                .replace(/"([^"]+)"/g, '<span class="px-2 py-1 bg-blue-100 text-blue-800 rounded font-medium">"$1"</span>')
                
                // Convert line breaks
                .replace(/\n/g, '<br>');
            
            aiContentDiv.innerHTML = `<div class="text-gray-700 leading-relaxed space-y-2 p-4 bg-white rounded-lg">${formattedContent}</div>`;
            document.getElementById('ai-results').classList.remove('hidden');
        }

        function copyAIResponse() {
            const aiContent = document.getElementById('ai-content');
            if (!aiContent) return;
            
            // Get the text content without HTML tags
            const textContent = aiContent.innerText || aiContent.textContent;
            
            // Copy to clipboard
            navigator.clipboard.writeText(textContent).then(() => {
                // Show success feedback
                const button = event.target.closest('button');
                const originalText = button.innerHTML;
                button.innerHTML = `
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                    Copied!
                `;
                button.classList.add('bg-green-500', 'bg-opacity-80');
                
                // Reset after 2 seconds
                setTimeout(() => {
                    button.innerHTML = originalText;
                    button.classList.remove('bg-green-500', 'bg-opacity-80');
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy text: ', err);
            });
        }
    </script>
</body>
</html>
