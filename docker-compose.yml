version: '3.8'

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: DjangoProjectIaJournal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d DjangoProjectIaJournal"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped

  django-migrate:
    build: .
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
    command: |
      sh -c "
        echo 'Checking for migration changes...'
        
        # Check if there are any changes that need migrations
        if python manage.py makemigrations --dry-run --check; then
          echo 'No new migrations needed.'
        else
          echo 'Creating new migrations...'
          python manage.py makemigrations
        fi
        
        echo 'Applying migrations...'
        python manage.py migrate
        
        echo 'Creating cache table if it does not exist...'
        python manage.py createcachetable || true
        
        echo 'Collecting static files...'
        python manage.py collectstatic --noinput
        
        echo 'Database setup complete!'
      "
    restart: "no"

  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./media:/app/media
      - ./static:/app/staticfiles
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      django-migrate:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_ORIGINS=*
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  ollama-setup:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: |
      sh -c "
        echo 'Waiting for Ollama to be ready...'
        sleep 10
        echo 'Pulling gemma2:2b model...'
        ollama pull gemma2:2b
        echo 'Model setup complete!'
      "
    restart: "no"

volumes:
  postgres_data:
  pgadmin_data:
  ollama_data: